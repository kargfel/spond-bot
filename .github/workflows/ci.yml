name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # matches the Dockerfile base image
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Lock file matches requirements.in
        run: |
          uv pip compile requirements.in --python-version 3.11 -o requirements.txt -q
          git diff --exit-code requirements.txt || {
            echo "::error file=requirements.txt::requirements.txt is out of date. Run: uv pip compile requirements.in --python-version 3.11 -o requirements.txt"
            exit 1
          }
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm run test:unit
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag spondbot:ci .
