name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11" # matches the Dockerfile base image
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Lock file matches requirements.in
        run: |
          uv pip compile requirements.in --python-version 3.11 -o requirements.txt -q
          git diff --exit-code requirements.txt || {
            echo "::error file=requirements.txt::requirements.txt is out of date. Run: uv pip compile requirements.in --python-version 3.11 -o requirements.txt"
            exit 1
          }
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q

  migrations:
    name: Migrations on Postgres 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spond
          POSTGRES_PASSWORD: spond
          POSTGRES_DB: spond_bot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spond -d spond_bot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://spond:spond@localhost:5432/spond_bot
      FERNET_KEY: ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=
      API_KEY: ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Downgrade one step and upgrade again
        run: alembic downgrade -1 && alembic upgrade head

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm run test:unit
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --tag spondbot:ci .
      - name: Validate docker-compose.yml
        run: |
          touch .env
          DB_PASSWORD=ci docker compose --profile autoheal config --quiet
