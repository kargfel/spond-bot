# Weekly dependency updates, grouped to keep the PR count low.
# Python: requirements.txt is a lock compiled from requirements.in. Dependabot bumps the
# pins in requirements.txt directly; CI's lock check confirms they still satisfy requirements.in.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      test-tooling:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
