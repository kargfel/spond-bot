<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sign in · SpondBot</title>
    <meta name="description" content="Sign in to SpondBot, which answers your Spond invites the second registration opens." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="member.css?v=2" />
  </head>
  <body>
    <div class="signin">
      <section class="signin-brand">
        <div>
          <div class="wordmark">Spond<span>Bot</span></div>
          <h1>Your answer goes out the second registration opens.</h1>
        </div>
        <dl class="signin-trace" aria-label="Example">
          <dt>Registration opens</dt><dd>19:30:00.000</dd>
          <dt>Answer sent</dt><dd>19:30:00.041</dd>
          <dt>Answer</dt><dd>Going</dd>
        </dl>
      </section>

      <main class="signin-main">
        <form class="signin-form" id="signin-form" novalidate>
          <h2>Sign in</h2>
          <p>Use the login your SpondBot admin gave you.</p>
          <p class="form-error" id="signin-error" role="alert" hidden></p>
          <div class="field">
            <label for="signin-username">Username</label>
            <input id="signin-username" class="input" type="text" autocomplete="username" autocapitalize="none" required />
          </div>
          <div class="field">
            <label for="signin-password">Password</label>
            <div class="pw-wrap">
              <input id="signin-password" class="input" type="password" autocomplete="current-password" required />
              <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" aria-controls="signin-password">Show</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" id="signin-btn">Sign in</button>
        </form>
      </main>
    </div>

    <script src="core.js?v=1"></script>
    <script src="app.js?v=8"></script>
    <script>
      (async function redirectIfSignedIn() {
        const user = await fetchCurrentUser();
        if (user) window.location.href = user.is_admin ? "/admin" : "/dashboard";
      })();

      document.getElementById("pw-toggle").addEventListener("click", (e) => {
        const input = document.getElementById("signin-password");
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        e.currentTarget.textContent = show ? "Hide" : "Show";
        e.currentTarget.setAttribute("aria-label", show ? "Hide password" : "Show password");
      });

      document.getElementById("signin-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("signin-btn");
        const errEl = document.getElementById("signin-error");
        const username = document.getElementById("signin-username").value.trim();
        const password = document.getElementById("signin-password").value;
        errEl.hidden = true;
        if (!username || !password) {
          errEl.textContent = "Enter your username and password.";
          errEl.hidden = false;
          return;
        }
        btn.disabled = true;
        btn.textContent = "Signing in…";
        try {
          await apiJson("/auth/login", "POST", { username, password });
          const user = await fetchCurrentUser();
          window.location.href = user && user.is_admin ? "/admin" : "/dashboard";
        } catch (err) {
          errEl.textContent = err.status === 429 ? "Too many sign-in attempts. Wait a minute and try again." : err.message;
          errEl.hidden = false;
          btn.disabled = false;
          btn.textContent = "Sign in";
        }
      });
    </script>
  </body>
</html>
