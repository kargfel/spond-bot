<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sign in · SpondBot</title>
    <meta name="description" content="Sign in to SpondBot, which answers your Spond invites the second registration opens." />
    <link rel="stylesheet" href="/fonts/fonts.css?v=1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171e1b" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SpondBot" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="member.css?v=3" />
  </head>
  <body>
    <div class="signin">
      <section class="signin-brand">
        <div>
          <div class="wordmark">Spond<span>Bot</span></div>
          <h1>Your answer goes out the second registration opens.</h1>
        </div>
        <dl class="signin-trace" aria-label="Example">
          <dt>Registration opens</dt><dd>19:30:00.000</dd>
          <dt>Answer sent</dt><dd>19:30:00.041</dd>
          <dt>Answer</dt><dd>Going</dd>
        </dl>
      </section>

      <main class="signin-main">
        <form class="signin-form" id="signin-form" novalidate>
          <h2>Sign in</h2>
          <p>Use the login your SpondBot admin gave you.</p>
          <p class="form-error" id="signin-error" role="alert" hidden></p>
          <div class="field">
            <label for="signin-username">Username</label>
            <input id="signin-username" class="input" type="text" autocomplete="username" autocapitalize="none" required />
          </div>
          <div class="field">
            <label for="signin-password">Password</label>
            <div class="pw-wrap">
              <input id="signin-password" class="input" type="password" autocomplete="current-password" required />
              <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" aria-controls="signin-password">Show</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" id="signin-btn">Sign in</button>
        </form>
      </main>
    </div>

    <script src="core.js?v=4"></script>
    <script src="app.js?v=9"></script>
    <script src="signin.js?v=1"></script>
  </body>
</html>
