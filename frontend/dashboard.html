<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpondBot — My Events</title>
    <meta
      name="description"
      content="View and manage your Spond event RSVP responses."
    />
    <link rel="stylesheet" href="style.css?v=4" />
  </head>
  <body>
    <div class="app-shell">
      <!-- ── Mobile Header (visible only on phones) ─────────────── -->
      <div class="mobile-header">
        <div class="mobile-header-logo">
          Spond<span class="logo-dim">Bot</span>
        </div>
        <div class="mobile-header-right">
          <button class="btn btn-outline btn-sm" id="mobile-sync-btn" onclick="triggerSync()">
            ${ICON.sync} Sync
          </button>
          <div class="mobile-header-avatar" id="mobile-avatar" onclick="showProfileModal()">
            ?
          </div>
        </div>
      </div>

      <!-- ── Sidebar (tablet + desktop) ────────────────────────────── -->
      <aside class="sidebar">
        <div class="sidebar-logo">
          <span class="sidebar-logo-text">SpondBot</span>
        </div>
        <nav class="sidebar-nav">
          <button
            class="sidebar-item active"
            onclick="window.location.reload()"
          >
            ${ICON.events} My Events
          </button>
          <button class="sidebar-item" onclick="showProfileModal()">
            ${ICON.user} My Profile
          </button>
          <!-- Only shown for admin accounts -->
          <a class="sidebar-item hidden" id="admin-nav-link" href="/admin">
            ${ICON.shield} Admin Panel
          </a>
        </nav>
        <div class="sidebar-footer">
          <div class="sidebar-user">
            <div class="avatar" id="user-avatar">?</div>
            <div>
              <div class="sidebar-username" id="user-display-name">
                Loading…
              </div>
              <div class="sidebar-role text-muted" style="font-size: 0.7rem">
                Spond Member
              </div>
            </div>
          </div>
          <button
            class="btn btn-ghost btn-sm"
            style="padding-left: 0"
            onclick="signOut()"
          >
            ${ICON.logout} Sign Out
          </button>
        </div>
      </aside>

      <!-- ── Main Content ───────────────────────────────────────── -->
      <main class="page-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">My Events</h1>
            <p class="text-muted text-sm mt-1">
              Manage your automated RSVP responses
            </p>
          </div>
          <button class="btn btn-outline" id="sync-btn" onclick="triggerSync()">
            ${ICON.sync} Sync Now
          </button>
        </div>

        <!-- Status Filter Tabs -->
        <div class="filter-tabs" id="status-tabs">
          <button
            class="filter-tab active"
            data-status=""
            onclick="setFilter(this, '')"
          >
            All
          </button>
          <button
            class="filter-tab"
            data-status="pending"
            onclick="setFilter(this, 'pending')"
          >
            Pending
          </button>
          <button
            class="filter-tab"
            data-status="processed"
            onclick="setFilter(this, 'processed')"
          >
            Processed
          </button>
          <button
            class="filter-tab"
            data-status="failed"
            onclick="setFilter(this, 'failed')"
          >
            Failed
          </button>
        </div>

        <!-- Past Events toggle -->
        <label class="past-toggle-row" for="show-past-toggle">
          <input type="checkbox" id="show-past-toggle" onchange="onPastToggle()" />
          Show past &amp; expired events
        </label>

        <!-- Refresh status bar -->
        <div class="refresh-bar" id="refresh-bar">
          <div class="refresh-dot"></div>
          <span id="refresh-label">Loading…</span>
        </div>

        <!-- Events list -->
        <div id="events-container">
          <!-- skeleton cards shown while loading -->
        </div>
      </main>

      <!-- ── Mobile Bottom Nav ──────────────────────────────────── -->
      <nav class="mobile-nav">
        <button class="mobile-nav-item active" id="mnav-events" onclick="window.location.reload()">
          ${ICON.events}
          <span>Events</span>
        </button>
        <button class="mobile-nav-item" id="mnav-profile" onclick="showProfileModal()">
          ${ICON.user}
          <span>Profile</span>
        </button>
        <a class="mobile-nav-item hidden" id="mnav-admin" href="/admin">
          ${ICON.shield}
          <span>Admin</span>
        </a>
        <button class="mobile-nav-item" onclick="signOut()">
          ${ICON.logout}
          <span>Sign Out</span>
        </button>
      </nav>
    </div>

    <!-- Profile Modal -->
    <div class="modal-overlay hidden" id="profile-modal">
      <div class="modal">
        <h2 class="modal-title">My Profile</h2>
        <div style="display: flex; flex-direction: column; gap: 1rem">
          <div class="field">
            <label>Display Name</label>
            <input id="profile-name" class="input" type="text" />
          </div>
          <div class="field">
            <label>Username</label>
            <input
              class="input"
              type="text"
              id="profile-username"
              disabled
              style="opacity: 0.5; cursor: not-allowed"
            />
          </div>
          <div class="field">
            <label>Spond Login</label>
            <input
              class="input"
              type="text"
              id="profile-login"
              disabled
              style="opacity: 0.5; cursor: not-allowed"
            />
          </div>
        </div>

        <!-- Password Change Section -->
        <div
          style="
            margin-top: 1.25rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--surface-container-high);
          "
        >
          <div
            class="section-title"
            style="font-size: 0.8rem; margin-bottom: 0.75rem"
          >
            Change Password
          </div>
          <div style="display: flex; flex-direction: column; gap: 0.75rem">
            <div class="field">
              <label>Current Password</label>
              <input
                id="pw-current"
                class="input"
                type="password"
                placeholder="••••••••"
                autocomplete="current-password"
              />
            </div>
            <div class="field">
              <label
                >New Password
                <span style="font-weight: 400">(min. 8 chars)</span></label
              >
              <input
                id="pw-new"
                class="input"
                type="password"
                placeholder="••••••••"
                minlength="8"
                autocomplete="new-password"
              />
            </div>
            <div class="field">
              <label>Confirm New Password</label>
              <input
                id="pw-confirm"
                class="input"
                type="password"
                placeholder="••••••••"
                autocomplete="new-password"
              />
            </div>
            <button class="btn btn-outline" onclick="changePassword()">
              Update Password
            </button>
          </div>
        </div>

        <div
          id="profile-error"
          class="auth-error"
          style="margin-top: 0.5rem"
        ></div>
        <div class="modal-footer">
          <button class="btn btn-ghost" onclick="closeProfileModal()">
            Cancel
          </button>
          <button class="btn btn-primary" onclick="saveProfile()">
            Save Profile
          </button>
        </div>
      </div>
    </div>

    <div id="toast-container"></div>

    <script src="app.js?v=4"></script>
    <script>
      // Replace template literals that couldn't render before app.js loaded
      document.querySelector(".sidebar-item.active").innerHTML =
        ICON.events + " My Events";
      document.querySelector(".sidebar-item:nth-child(2)").innerHTML =
        ICON.user + " My Profile";
      document.getElementById("admin-nav-link").innerHTML =
        ICON.shield + " Admin Panel";
      document.querySelector(".sidebar-footer .btn-ghost").innerHTML =
        ICON.logout + " Sign Out";
      document.querySelector("#sync-btn").innerHTML = ICON.sync + " Sync Now";
      document.querySelector("#mobile-sync-btn").innerHTML = ICON.sync + " Sync";
      // Mobile nav icons
      document.getElementById("mnav-events").innerHTML = ICON.events + "<span>Events</span>";
      document.getElementById("mnav-profile").innerHTML = ICON.user + "<span>Profile</span>";
      document.getElementById("mnav-admin").innerHTML = ICON.shield + "<span>Admin</span>";
      document.querySelector(".mobile-nav .mobile-nav-item:last-child").innerHTML =
        ICON.logout + "<span>Sign Out</span>";

      // ── State ─────────────────────────────────────────────────────────
      let payload = null;
      let statusFilter = "";
      let showPastEvents = false;
      let spond_user = null;

      // ── Auto-refresh state ─────────────────────────────────────────────
      const REFRESH_INTERVAL_MS = 60 * 60 * 1000; // 1 hour
      let lastRefreshed = null;
      let nextRefreshAt = null;
      let refreshTimer = null;
      let countdownTimer = null;

      // ── Init ───────────────────────────────────────────────────────────
      async function init() {
        payload = await requireAuth();

        const username = payload.username || "?";
        document.getElementById("user-avatar").textContent = initials(username);
        document.getElementById("user-display-name").textContent = username;
        document.getElementById("mobile-avatar").textContent = initials(username);

        if (payload.is_admin) {
          document.getElementById("admin-nav-link").classList.remove("hidden");
          document.getElementById("mnav-admin").classList.remove("hidden");
          document.querySelector(".sidebar-role").textContent = "Administrator";
          document.querySelector(".sidebar-role").style.color = "var(--mint)";
        }

        if (payload.linked_user_id) {
          try {
            const res = await api(`/users/${payload.linked_user_id}`);
            if (res.ok) {
              spond_user = await res.json();
              document.getElementById("user-display-name").textContent =
                spond_user.display_name;
              document.getElementById("mobile-avatar").textContent = initials(
                spond_user.display_name,
              );
              document.getElementById("user-avatar").textContent = initials(
                spond_user.display_name,
              );
            }
          } catch {}
        }

        await loadEvents();
        startAutoRefresh();
      }

      // ── Auto-refresh Logic ─────────────────────────────────────────────
      function startAutoRefresh() {
        clearInterval(refreshTimer);
        clearInterval(countdownTimer);

        nextRefreshAt = new Date(Date.now() + REFRESH_INTERVAL_MS);

        refreshTimer = setInterval(async () => {
          await loadEvents(true /* silent */);
          nextRefreshAt = new Date(Date.now() + REFRESH_INTERVAL_MS);
        }, REFRESH_INTERVAL_MS);

        // Update the countdown label every 30 seconds
        countdownTimer = setInterval(updateRefreshLabel, 30000);
      }

      function updateRefreshLabel() {
        const label = document.getElementById("refresh-label");
        if (!label) return;

        if (!lastRefreshed) {
          label.textContent = "Loading…";
          return;
        }

        const msUntil = nextRefreshAt - Date.now();
        const minUntil = Math.ceil(msUntil / 60000);
        const sinceMin = Math.floor((Date.now() - lastRefreshed) / 60000);

        const sinceStr = sinceMin < 1 ? "just now" : `${sinceMin} min ago`;
        const nextStr  = minUntil <= 1 ? "< 1 min" : `${minUntil} min`;

        label.textContent = `Updated ${sinceStr} · Refreshing in ${nextStr}`;
      }

      // ── Load Events ────────────────────────────────────────────────────
      async function loadEvents(silent = false) {
        const container = document.getElementById("events-container");

        if (!silent) {
          // Show skeleton loaders instead of a spinner
          container.innerHTML = skeletonCards(4);
        }

        let url = "/events";
        if (statusFilter) url += `?status=${statusFilter}`;

        try {
          const res = await api(url);
          if (res.status === 401) {
            await redirectToLogin();
            return;
          }
          if (!res.ok) throw new Error("Failed to load events");
          let events = await res.json();

          // Sort by start_timestamp ascending (upcoming first)
          events = events.sort((a, b) => {
            const timeA = a.start_timestamp
              ? new Date(a.start_timestamp).getTime()
              : Infinity;
            const timeB = b.start_timestamp
              ? new Date(b.start_timestamp).getTime()
              : Infinity;
            return timeA - timeB;
          });

          // Apply decay filter
          const visible = events.filter(ev => shouldShowEvent(ev, showPastEvents));
          const hiddenCount = events.length - visible.length;

          renderEvents(visible, hiddenCount);

          lastRefreshed = Date.now();
          updateRefreshLabel();
        } catch (err) {
          container.innerHTML = `<div class="empty-state"><div class="empty-state-title">Could not load events</div><div class="empty-state-sub">${err.message}</div></div>`;
        }
      }

      function onPastToggle() {
        showPastEvents = document.getElementById("show-past-toggle").checked;
        loadEvents();
      }

      function setFilter(el, status) {
        statusFilter = status;
        document
          .querySelectorAll(".filter-tab")
          .forEach((t) => t.classList.remove("active"));
        el.classList.add("active");
        loadEvents();
      }

      // ── Render Events ──────────────────────────────────────────────────
      function renderEvents(events, hiddenCount) {
        const container = document.getElementById("events-container");

        // Hint about hidden events when user hasn't toggled "show past"
        const hiddenHint = (!showPastEvents && hiddenCount > 0)
          ? `<div class="past-toggle-row" style="padding:0;font-size:0.76rem;color:var(--text-dim);margin-bottom:0.75rem">
               ${ICON.timer} ${hiddenCount} past event${hiddenCount !== 1 ? 's' : ''} hidden —
               <label style="color:var(--mint);cursor:pointer;text-decoration:underline;font-size:0.76rem" for="show-past-toggle">show them</label>
             </div>`
          : '';

        if (!events.length) {
          container.innerHTML = hiddenHint + `
            <div class="empty-state">
              <div class="empty-state-title">No events found</div>
              <div class="empty-state-sub">Use "Sync Now" to discover new events from Spond.</div>
              <button class="btn btn-outline" onclick="triggerSync()">Sync Now</button>
            </div>`;
          return;
        }

        container.innerHTML = hiddenHint + `<div class="events-list">${events.map(renderEventCard).join("")}</div>`;
      }

      function renderEventCard(ev) {
        const isProcessed = ev.status === "processed";
        const deadlineTs = ev.invite_time || ev.rsvp_date;
        let deadlineMeta = "";
        if (isProcessed && deadlineTs) {
          deadlineMeta = `<span class="event-meta-item" style="color:var(--mint)">${ICON.clock} RSVPed before ${fmtDate(deadlineTs)}</span>`;
        } else if (deadlineTs) {
          deadlineMeta = `<span class="event-meta-item" style="${isOverdue(deadlineTs) ? "color:var(--status-red)" : ""}"><span title="${ev.invite_time ? "RSVP deadline (inviteTime)" : "Registration deadline (rsvpDate)"}">${ICON.clock} RSVP by ${fmtDate(deadlineTs)}</span></span>`;
        }

        // Countdown badge
        let countdownHtml = "";
        const cd = timeUntil(ev.start_timestamp);
        if (cd && ev.status !== "processed") {
          countdownHtml = `<div class="event-countdown ${cd.cls}">${ICON.timer} ${cd.label}</div>`;
        }

        const errorHtml = ev.error_message
          ? `<div class="event-error">${ev.error_message}</div>`
          : "";

        return `
      <div class="event-card" id="card-${ev.id}">
        <div class="event-card-bar ${ev.status}"></div>
        <div class="event-card-body">
          <div class="event-card-info">
            <div class="event-title">${escHtml(ev.heading || "Untitled Event")}</div>
            <div class="event-meta">
              ${ev.start_timestamp ? `<span class="event-meta-item">${ICON.calendar} ${fmtDate(ev.start_timestamp)}</span>` : ""}
              ${deadlineMeta}
            </div>
            ${countdownHtml}
            ${errorHtml}
          </div>
          <div class="event-card-actions">
            <div class="event-badges">
              ${choiceBadge(ev.user_choice)}
              ${statusBadge(ev.status)}
            </div>
            <div class="rsvp-buttons">
              <button class="rsvp-btn accept ${ev.user_choice === "accept" ? "active" : ""}"
                onclick="setDecision('${ev.id}', 'accept')">Accept</button>
              <button class="rsvp-btn decline ${ev.user_choice === "decline" ? "active" : ""}"
                onclick="setDecision('${ev.id}', 'decline')">Decline</button>
              <button class="rsvp-btn manual ${ev.user_choice === "manual" ? "active" : ""}"
                onclick="setDecision('${ev.id}', 'manual')">Manual</button>
            </div>
          </div>
        </div>
      </div>`;
      }

      // ── RSVP Decision ──────────────────────────────────────────────────
      async function setDecision(eventId, choice) {
        try {
          const res = await api(`/events/${eventId}/decision`, "PATCH", {
            user_choice: choice,
          });
          if (!res.ok)
            throw new Error((await res.json()).detail || "Update failed");
          const updated = await res.json();
          const card = document.getElementById(`card-${eventId}`);
          if (card) {
            card.outerHTML = renderEventCard(updated);
          }
          showToast(`RSVP set to "${choice}"`, "success");
        } catch (err) {
          showToast(err.message, "error");
        }
      }

      // ── Sync ───────────────────────────────────────────────────────────
      async function triggerSync() {
        const btn = document.getElementById("sync-btn");
        const mBtn = document.getElementById("mobile-sync-btn");
        if (btn) { btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Syncing…`; }
        if (mBtn) { mBtn.disabled = true; mBtn.innerHTML = `<span class="spinner"></span>`; }
        try {
          const res = await api("/sync", "POST");
          if (!res.ok && res.status !== 403) throw new Error("Sync failed");
          showToast(
            res.status === 403
              ? "Only admins can trigger sync."
              : "Discovery sync triggered — events will update shortly.",
            res.status === 403 ? "info" : "success",
          );
          setTimeout(() => loadEvents(true), 4000);
        } catch (err) {
          showToast(err.message, "error");
        } finally {
          setTimeout(() => {
            if (btn) { btn.disabled = false; btn.innerHTML = ICON.sync + " Sync Now"; }
            if (mBtn) { mBtn.disabled = false; mBtn.innerHTML = ICON.sync + " Sync"; }
          }, 5000);
        }
      }

      // ── Profile Modal ──────────────────────────────────────────────────
      function showProfileModal() {
        document.getElementById("profile-username").value = payload.username;
        document.getElementById("pw-current").value = "";
        document.getElementById("pw-new").value = "";
        document.getElementById("pw-confirm").value = "";
        document.getElementById("profile-error").style.display = "none";
        if (spond_user) {
          document.getElementById("profile-name").value =
            spond_user.display_name;
          document.getElementById("profile-login").value = spond_user.login;
        }
        document.getElementById("profile-modal").classList.remove("hidden");
      }

      function closeProfileModal() {
        document.getElementById("profile-modal").classList.add("hidden");
      }

      async function saveProfile() {
        const name = document.getElementById("profile-name").value.trim();
        if (!name || !spond_user) return;
        try {
          const res = await api(`/users/${spond_user.id}`, "PATCH", {
            display_name: name,
          });
          if (!res.ok)
            throw new Error((await res.json()).detail || "Update failed");
          spond_user = await res.json();
          document.getElementById("user-display-name").textContent =
            spond_user.display_name;
          document.getElementById("user-avatar").textContent = initials(
            spond_user.display_name,
          );
          document.getElementById("mobile-avatar").textContent = initials(
            spond_user.display_name,
          );
          closeProfileModal();
          showToast("Profile updated.", "success");
        } catch (err) {
          showToast(err.message, "error");
        }
      }

      async function changePassword() {
        const errEl = document.getElementById("profile-error");
        const current = document.getElementById("pw-current").value;
        const newPw = document.getElementById("pw-new").value;
        const confirm = document.getElementById("pw-confirm").value;
        errEl.style.display = "none";
        if (!current || !newPw) {
          errEl.textContent = "Fill in current and new password.";
          errEl.style.display = "block";
          return;
        }
        if (newPw.length < 8) {
          errEl.textContent = "New password must be at least 8 characters.";
          errEl.style.display = "block";
          return;
        }
        if (newPw !== confirm) {
          errEl.textContent = "Passwords do not match.";
          errEl.style.display = "block";
          return;
        }
        try {
          const res = await api("/auth/me/password", "PATCH", {
            current_password: current,
            new_password: newPw,
          });
          if (!res.ok) throw new Error((await res.json()).detail || "Failed");
          document.getElementById("pw-current").value = "";
          document.getElementById("pw-new").value = "";
          document.getElementById("pw-confirm").value = "";
          showToast("Password updated successfully.", "success");
        } catch (err) {
          errEl.textContent = err.message;
          errEl.style.display = "block";
        }
      }

      // ── Utility ────────────────────────────────────────────────────────
      function escHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // Close modal on overlay click
      document
        .getElementById("profile-modal")
        .addEventListener("click", function (e) {
          if (e.target === this) closeProfileModal();
        });

      init();
    </script>
  </body>
</html>
