<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>My events · SpondBot</title>
    <meta name="description" content="Choose how SpondBot answers your upcoming Spond events." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="member.css?v=1" />
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="/dashboard">Spond<span>Bot</span></a>
      <span class="live" id="live" hidden>Live</span>
      <div class="account">
        <button class="avatar-btn" id="account-btn" aria-label="Account" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu">?</button>
        <div class="menu" id="account-menu" role="menu" aria-label="Account" hidden>
          <div class="menu-head"><b id="menu-name">…</b><span id="menu-sub"></span></div>
          <button role="menuitem" type="button" id="menu-profile">Profile</button>
          <button role="menuitem" type="button" id="menu-password">Change password</button>
          <a role="menuitem" href="/admin" id="menu-admin" hidden>Admin panel</a>
          <button role="menuitem" type="button" id="menu-signout">Sign out</button>
        </div>
      </div>
    </header>

    <main class="page">
      <section class="summary" data-testid="summary">
        <h1 id="headline">Loading your events…</h1>
        <p id="subline"></p>
      </section>

      <div class="failures" id="failures"></div>

      <div class="layout" id="layout">
        <section class="inbox" id="inbox" aria-labelledby="inbox-title" hidden>
          <h2 class="section-label" id="inbox-title">Needs an answer</h2>
          <div id="inbox-card"></div>
        </section>

        <section class="agenda" id="agenda" aria-label="Events" hidden>
          <div class="tabs" role="tablist" aria-label="Show">
            <button role="tab" id="tab-upcoming" aria-selected="true" aria-controls="agenda-list" type="button">Upcoming</button>
            <button role="tab" id="tab-past" aria-selected="false" aria-controls="agenda-list" type="button" tabindex="-1">Past</button>
          </div>
          <div class="agenda-list" id="agenda-list" role="tabpanel" aria-labelledby="tab-upcoming">
            <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
          </div>
        </section>
      </div>
    </main>

    <dialog id="profile-dialog" aria-labelledby="profile-title">
      <form class="dialog-body" id="profile-form" method="dialog" novalidate>
        <h2 id="profile-title">Profile</h2>
        <p class="form-error" role="alert" data-error hidden></p>
        <div class="field">
          <label for="profile-username">Username</label>
          <input id="profile-username" class="input" type="text" readonly />
        </div>
        <div class="field" data-linked>
          <label for="profile-name">Display name</label>
          <input id="profile-name" class="input" type="text" maxlength="255" autocomplete="name" />
        </div>
        <div class="field" data-linked>
          <label for="profile-login">Spond login</label>
          <input id="profile-login" class="input" type="text" readonly />
        </div>
        <div class="dialog-actions">
          <button type="button" class="btn btn-quiet" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary" id="profile-save" data-linked>Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="password-dialog" aria-labelledby="password-title">
      <form class="dialog-body" id="password-form" method="dialog" novalidate>
        <h2 id="password-title">Change password</h2>
        <p class="form-error" role="alert" data-error hidden></p>
        <div class="field">
          <label for="pw-current">Current password</label>
          <input id="pw-current" class="input" type="password" autocomplete="current-password" />
        </div>
        <div class="field">
          <label for="pw-new">New password</label>
          <input id="pw-new" class="input" type="password" minlength="8" autocomplete="new-password" aria-describedby="pw-hint" />
          <span class="hint" id="pw-hint">At least 8 characters.</span>
        </div>
        <div class="field">
          <label for="pw-repeat">Repeat new password</label>
          <input id="pw-repeat" class="input" type="password" autocomplete="new-password" />
        </div>
        <div class="dialog-actions">
          <button type="button" class="btn btn-quiet" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary">Update password</button>
        </div>
      </form>
    </dialog>

    <script src="core.js?v=1"></script>
    <script src="app.js?v=8"></script>
    <script src="dashboard.js?v=1"></script>
  </body>
</html>
