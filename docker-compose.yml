services:
  db:
    image: postgres:16-alpine
    container_name: spond-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: spond_bot
      POSTGRES_USER: spond
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spond -d spond_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: spond-bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Europe/Berlin}
    # The app needs no extra privileges: it listens on an unprivileged port as a non-root user.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Health: the image's HEALTHCHECK polls /api/v1/health (see Dockerfile).
    # Only the optional autoheal service below acts on this label.
    labels:
      autoheal: "true"

  # Database backups: pg_dump every BACKUP_INTERVAL_HOURS into BACKUP_DIR,
  # keeping BACKUP_KEEP_DAYS days. Restore steps: docs/setup.md.
  backup:
    image: postgres:16-alpine
    container_name: spond-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/scripts/backup.sh"]
    command: ["loop"]
    environment:
      PGHOST: db
      PGUSER: spond
      PGDATABASE: spond_bot
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    healthcheck:
      test: ["CMD", "sh", "/scripts/backup.sh", "check"]
      interval: 1h
      timeout: 10s
      start_period: 5m

  # Optional: restart the app automatically when it turns unhealthy.
  # Docker itself only restarts containers that exit. Enable with:
  #   docker compose --profile autoheal up -d
  # It needs the Docker socket, which gives it control over all containers
  # on the host; leave it off if that is not acceptable.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: spond-autoheal
    profiles: ["autoheal"]
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
